<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Personal Information</title>
    </head>
    <body>
        <h2>Personal Information Form</h2>
        <form action="education.html" method="get">
            <fieldset>
                <legend>Personal Information</legend>
                <label for="fname">First Name: </label>
                <input type="text" id="fname" name="fname" required placeholder="Enter first name">
                <br></br>
                <label for="lname">Last Name: </label>
                <input type="text" id="lname" name="lname" required placeholder="Enter last name">
                <br></br>
                <label for="email">Email: </label>
                <input type="email" id="email" name="email" required placeholder="abc@gmail.com">
                <br></br>
                <label for="password">Password: </label>
                <input type="password" id="password" name="password" required>
                <br></br>
                <label for="phone">Mobile Number: </label>
                <input type="tel" id="phone" name="phone" required>
                <br></br>
                <label for="dob">date of Birth: </label>
                <input type="date" id="dob" name="dob" required>
                <br></br>
                <label>Gender:</label>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>
                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label>
                <br></br>
                <label for="address">Address:</label>
                <textarea id="address" name="address" rows="4" cols="40"></textarea>
                <br><br>
                <label for="city">City: </label>
                <input type="text" id="city" name="city">
                <br></br>
                <label for="state">State: </label>
                <select id="state" name="state">
                    <option value="">--Select State</option>
                    <option value="Andhra Pradesh">Andhra Pradesh</opton>
                    <option value="Karnataka">Karnataka</option>
                    <option value="Kerala">Kerala</option>
                    <option value="Telangana">Telangana</option>
                </select>
                <br><br>
                <label for="pincode">PIN Code: </label>
                <input type="number" id="pincode" name="pincode">
                <br><br>
                <label for="photo">Upload Photo: </label>
                <input type="file" id="photo" name="photo">
                <br><br>
                <label for="favcolor">Favourite Colour: </label>
                <input type="color" id="favcolor" name="favcolor">
                <br><br>
                <label>Hobbies: </label>
                <input type="checkbox" id="reading" name="hobby" value="reading">
                <label for="reading">Reading</label>
                <input type="checkbox" id="sports" name="hobby" value="sports">
                <label for="sports">Sports</label>
                <input type="checkbox" id="music" name="hobby" value="music">
                <label for="music">Music</label>
                <input type="checkbox" id="travel" name="hobby" value="travel">
                <label for="travel">Travel</label>
            </fieldset>
            <br>
            <input type="submit" value="Next:Education">
            <input type="reset" value="Reset"><br>
            <button type="submit" onclick="alert('Form is ready to submit!')">Cick Me</button>
        </form>
    </body>
</html>
