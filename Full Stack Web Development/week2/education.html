<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Educational Details</title>
</head>
<body>
    <h1>Educational Details Form</h1>
    <form action="#" method="post">
        <fieldset>
            <legend>Educational Information</legend>
            <label for="qualification">Highest Qualification:</label>
            <select id="qualification" name="qualification">
                <option value="">-- Select Qualification --</option>
                <option value="10th">10th / SSC</option>
                <option value="12th">12th / Intermediate</option>
                <option value="diploma">Diploma</option>
                <option value="degree">Degree</option>
                <option value="btech">B.Tech</option>
                <option value="bsc">B.Sc</option>
                <option value="bcom">B.Com</option>
                <option value="ba">B.A</option>
                <option value="mtech">M.Tech</option>
                <option value="msc">M.Sc</option>
                <option value="mba">MBA</option>
            </select>
            <br><br>
            <label for="school">School / College Name:</label>
            <input type="text" id="school" name="school">
            <br><br>
            <label for="university">University / Board:</label>
            <input type="text" id="university" name="university">
            <br><br>
            <label for="branch">Branch / Specialization:</label>
            <input type="text" id="branch" name="branch">
            <br><br>
            <label for="year">Year of Passing:</label>
            <input type="number" id="year" name="year" min="1950" max="2100">
            <br><br>
            <label for="percentage">Percentage:</label>
            <input type="number" id="percentage" name="percentage" min="0" max="100" step="0.01">
            <br><br>
            <label for="cgpa">CGPA:</label>
            <input type="number" id="cgpa" name="cgpa" min="0" max="10" step="0.01">
            <br><br>
            <label for="startdate">Course Start Date:</label>
            <input type="date" id="startdate" name="startdate">
            <br><br>
            <label for="enddate">Course End Date:</label>
            <input type="date" id="enddate" name="enddate">
            <br><br>
            <label>Mode of Study:</label>
            <input type="radio" id="regular" name="mode" value="regular">
            <label for="regular">Regular</label>
            <input type="radio" id="distance" name="mode" value="distance">
            <label for="distance">Distance</label>
            <input type="radio" id="online" name="mode" value="online">
            <label for="online">Online</label>
            <br><br>
            <label>Skills:</label><br>
            <input type="checkbox" id="html" name="skill" value="html">
            <label for="html">HTML</label><br>
            <input type="checkbox" id="css" name="skill" value="css">
            <label for="css">CSS</label><br>
            <input type="checkbox" id="javascript" name="skill" value="javascript">
            <label for="javascript">JavaScript</label><br>
            <input type="checkbox" id="python" name="skill" value="python">
            <label for="python">Python</label><br>
            <input type="checkbox" id="java" name="skill" value="java">
            <label for="java">Java</label>
            <br><br>
            <label for="resume">Upload Resume:</label>
            <input type="file" id="resume" name="resume">
            <br><br>
            <label for="website">Personal Website:</label>
            <input type="url" id="website" name="website" placeholder="https://example.com">
            <br><br>
            <label for="search">Search Course:</label>
            <input type="search" id="search" name="search">
            <br><br>
            <label for="satisfaction">Education Satisfaction:</label>
            <input type="range" id="satisfaction" name="satisfaction" min="0" max="10">
            <br><br>
            <label for="comments">Additional Information:</label><br>
            <textarea id="comments" name="comments" rows="5" cols="40"></textarea>
        </fieldset>
        <br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
        <button type="button" onclick="alert('Thank you for entering your details!')">Click Me</button>
        <button type="button" onclick="history.back()">Back to Personal Information</button>
    </form>
</body>
</html>
